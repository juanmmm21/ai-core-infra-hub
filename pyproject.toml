[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicore"
version = "0.1.0"
description = "AI Core SDK: one stable, typed API over the ai-core components (RAG, agents, ops)."
readme = "docs/sdk.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
# The core (types, adapters' protocols, embedders, the OpenAI-compatible client) needs only
# NumPy. Each area pulls its components; a component is never imported until its area is used.
dependencies = ["numpy>=1.20"]

# The components are installed straight from their repositories (PEP 508 direct references),
# as nanosql does with the strata engines. They never import each other: this SDK is the only
# place where their types meet, through `aicore.adapters`.
#
# Every reference is pinned: to a component tag (vX.Y.Z) or, until that tag is pushed, to the exact
# commit of the component's main that the tag marks. A component change ships as: its minor
# version -> main -> tag -> the pin here -> a new aicore version and tag.
[project.optional-dependencies]
rag = [
    "bpe-tokenizer-from-scratch @ git+https://github.com/juanmmm21/bpe-tokenizer-from-scratch.git@ec938d0a4db6f6eac4f20efa8417d51a609b00cd",
    "semantic-chunking-engine @ git+https://github.com/juanmmm21/semantic-chunking-engine.git@981554254f2142cdcdbb931c1b7032c801880b48",
    "multimodal-doc-parser @ git+https://github.com/juanmmm21/multimodal-doc-parser.git@e78264a0f4552616729d6934d7b1512db5404545",
    "nano-vector-db @ git+https://github.com/juanmmm21/nano-vector-db.git@v0.1.0",
    "knowledge-graph-extractor @ git+https://github.com/juanmmm21/knowledge-graph-extractor.git@5142141f201f430114939f8a250b81187800aed1",
    "hybrid-search-retrieval-pipeline @ git+https://github.com/juanmmm21/hybrid-search-retrieval-pipeline.git@3c93049efbbee7e211ad3f5a93d045e4aa3b8fbd",
    "cross-encoder-reranker @ git+https://github.com/juanmmm21/cross-encoder-reranker.git@36b2e5dfc15a5fde71ce0190005e326dbc90e638",
]
agents = [
    "semantic-model-router @ git+https://github.com/juanmmm21/semantic-model-router.git@fa5b1adab7ac72da45716f2e071f5772d87309ac",
    "llm-guardrails-shield @ git+https://github.com/juanmmm21/llm-guardrails-shield.git@da9999a02ac21758280ae13134da37a1107795f5",
    "orchestra-agents @ git+https://github.com/juanmmm21/orchestra-agents.git@7f0b750db0d71ad8372ef580c8347c690b8f949d",
    "agentic-memory-layer @ git+https://github.com/juanmmm21/agentic-memory-layer.git@17a23c015f669f28a64d7e3a5697c0f1cbc60131",
    "secure-tool-runtime @ git+https://github.com/juanmmm21/secure-tool-runtime.git@878b5d2a8940f55ba9d7b03651ada63c3db96015",
]
ops = [
    "httpx>=0.24",
    "llm-inference-server @ git+https://github.com/juanmmm21/llm-inference-server.git@db8ab2800c044d6354486e9e5353df189c6e320f",
    "llm-observability-tracer[otel] @ git+https://github.com/juanmmm21/llm-observability-tracer.git@66c507cf8fd058402c1ae38cb2a6a75b9d59cbd0",
    "llm-eval-harness @ git+https://github.com/juanmmm21/llm-eval-harness.git@a5a9e1a0179cb57e41113cc40ef20bdafb4dcfb8",
    "synthetic-data-generator @ git+https://github.com/juanmmm21/synthetic-data-generator.git@66cfdd046c3205ba173bcbde22faf241c814245e",
    "dataset-version-control @ git+https://github.com/juanmmm21/dataset-version-control.git@50f99af38225c8fc7d3b6e792c59da8b9ee65f31",
    "llm-annotation-studio @ git+https://github.com/juanmmm21/llm-annotation-studio.git@214690713855a1e00d91c8f9861843d632df5618",
]
# PyTorch-heavy pieces, kept apart so `rag`, `agents` and `ops` stay light.
train = [
    "llm-qlora-finetuner[hf] @ git+https://github.com/juanmmm21/llm-qlora-finetuner.git@607cb28f9be731ead98978949cfe1711b7859d79",
    "contrastive-embedding-trainer @ git+https://github.com/juanmmm21/contrastive-embedding-trainer.git@v0.1.0",
]
all = ["aicore[rag,agents,ops,train]"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "fastapi>=0.100", "httpx>=0.24", "python-multipart>=0.0.6"]

[project.urls]
Repository = "https://github.com/juanmmm21/ai-core-infra-hub"

[tool.hatch.build.targets.wheel]
packages = ["src/aicore"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "test_hub.py"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["test_hub.py", "example.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/aicore"]
# The components publish no type information; adapters meet them as `Any`.
[[tool.mypy.overrides]]
module = [
    "bpe_tokenizer_from_scratch.*", "semantic_chunking_engine.*", "multimodal_doc_parser.*",
    "nano_vector_db.*", "knowledge_graph_extractor.*", "hybrid_search_retrieval_pipeline.*",
    "cross_encoder_reranker.*", "semantic_model_router.*", "llm_guardrails_shield.*",
    "orchestra_agents.*", "agentic_memory_layer.*", "secure_tool_runtime.*",
    "llm_inference_server.*", "llm_observability_tracer.*", "llm_eval_harness.*",
    "synthetic_data_generator.*", "dataset_version_control.*", "llm_annotation_studio.*",
    "llm_qlora_finetuner.*", "contrastive_embedding_trainer.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true
